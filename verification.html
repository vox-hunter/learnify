<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Email</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f4; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4; padding:20px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
          
          <!-- Header -->
          <tr>
            <td style="background:#6b46c1; padding:30px; text-align:center;">
              <h1 style="color:#fff; font-size:24px; margin:0;">AI Loom</h1>
              <p style="color:#e0e7ff; margin:5px 0 0;">Smart Learning Platform</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px; text-align:center;">
              <h2 style="color:#1f2937; margin-bottom:20px;">Verify Your Email</h2>
              <p style="color:#4b5563; margin-bottom:30px;">Use the code below to complete your signup. This code expires in 10 minutes.</p>

              <div style="display:inline-block; background:#f3f4f6; border:2px solid #6b46c1; padding:20px 30px; border-radius:8px;">
                <span style="font-size:28px; color:#6b46c1; font-weight:bold; letter-spacing:5px; font-family:'Courier New', monospace;">{code}</span>
              </div>

              <p style="color:#6b7280; margin-top:30px; font-size:14px;">If you didn’t sign up for AI Loom, you can safely ignore this email.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb; padding:20px; text-align:center; font-size:12px; color:#9ca3af;">
              <p style="margin:0;">AI Loom, Bangkok, Thailand</p>
              <p style="margin:5px 0;">This is an automated email – please don’t reply.</p>
              <p style="margin:5px 0;"><a href="https://ai-loom.com/unsubscribe" style="color:#9ca3af; text-decoration:underline;">Unsubscribe</a></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
