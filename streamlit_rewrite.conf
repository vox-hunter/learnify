# Nginx configuration for Streamlit SPA routing
# This configuration ensures that direct URL access to any route serves the main Streamlit app
# Place this in your nginx sites-available configuration

location / {
    # First attempt to serve request as file, then as directory
    # If both fail, serve the main app (for SPA routing)
    try_files $uri $uri/ @streamlit;
    
    # Handle specific routes that should serve the main app
    location ~ ^/(privacy|terms|course|login)/?$ {
        try_files @streamlit;
    }
}

location @streamlit {
    # Proxy to Streamlit application
    proxy_pass http://localhost:8501;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # WebSocket support
    proxy_buffering off;
    proxy_read_timeout 86400;
}