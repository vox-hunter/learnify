# Render deployment configuration for Learnify
# This configures both the FastAPI backend and Vue.js frontend

services:
  # FastAPI Backend Service
  - type: web
    name: learnify-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r api/requirements.txt
    startCommand: |
      cd api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DEBUG_MODE
        value: "False"
      - key: COOKIE_ENCRYPTION_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Vue.js Frontend Service (Static Site)
  - type: web
    name: learnify-frontend
    env: static
    plan: free
    buildCommand: |
      cd vue-frontend && npm install && npm run build
    staticPublishPath: ./vue-frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://learnify-backend.onrender.com/api/*
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
