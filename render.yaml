# Render deployment configuration
# This file configures URL redirects for proper multipage routing

services:
  - type: web
    name: learnify
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/main.py --server.port=$PORT --server.address=0.0.0.0
    
    # URL redirects for multipage routing
    # Redirect all page routes to main app with query parameters
    redirects:
      - source: /privacy
        destination: /?page=privacy
        type: 301
      - source: /terms
        destination: /?page=terms
        type: 301
      - source: /course
        destination: /?page=course
        type: 301
      - source: /login
        destination: /?page=login
        type: 301
      
      # Case variations
      - source: /Privacy
        destination: /?page=privacy
        type: 301
      - source: /Terms
        destination: /?page=terms
        type: 301
      - source: /Course
        destination: /?page=course
        type: 301
      - source: /Login
        destination: /?page=login
        type: 301